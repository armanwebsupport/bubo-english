<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubo English Sikho</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#1d1a4a;--sun:#ffc93c;--coral:#ff7096;--teal:#3ec6c0;--mint:#bff3d2;--ink:#241f5c;--card:#fffdf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Nunito','Noto Sans Devanagari',sans-serif;font-weight:600;color:#fff;background:radial-gradient(circle at 15% 8%,#4a3fb0 0,transparent 40%),radial-gradient(circle at 90% 85%,#1f7f8c 0,transparent 35%),var(--night)}
#app{max-width:520px;margin:0 auto;padding:16px 16px 120px}
h1,h2,.f{font-family:'Fredoka',sans-serif;font-weight:600;margin:0}
.hi{font-family:'Noto Sans Devanagari','Nunito',sans-serif;font-weight:700}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{background:rgba(255,255,255,.13);border-radius:999px;padding:8px 16px;font-family:'Fredoka';font-size:18px}
.bubo{display:flex;align-items:flex-end;gap:12px;margin:20px 0}
.bubo .o{font-size:70px;line-height:1;animation:bob 3s ease-in-out infinite}
.say{background:var(--card);color:var(--ink);border-radius:24px 24px 24px 6px;padding:12px 18px;font-size:18px;font-weight:800;flex:1}
.say small{display:block;font-size:15px;opacity:.7}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
h2.s{font-size:22px;margin:6px 4px 12px}
.list{display:grid;gap:14px}
.g{display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:var(--card);color:var(--ink);border-radius:28px;padding:16px 18px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.g:active,.big:active{transform:translateY(5px)}
.g .e{font-size:44px;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;flex:none}
.g h3{font-family:'Fredoka','Noto Sans Devanagari',sans-serif;font-size:22px;margin:0}.g span{font-size:15px;opacity:.7}.g .ck{margin-left:auto;font-size:28px}
.prog{display:flex;gap:6px;justify-content:center;margin:14px 0}
.prog i{flex:1;max-width:46px;height:9px;border-radius:6px;background:rgba(255,255,255,.2)}.prog i.on{background:var(--sun)}
.card{background:var(--card);color:var(--ink);border-radius:32px;text-align:center;padding:26px 18px;box-shadow:0 9px 0 rgba(0,0,0,.18)}
.card .em{font-size:96px;line-height:1.1}.card .en{font-family:'Fredoka','Noto Sans Devanagari',sans-serif;font-size:clamp(28px,9vw,38px);margin-top:8px}.card .hn{font-size:22px;opacity:.75;margin-top:6px}
.row{display:flex;gap:12px;margin-top:18px}.row>*{flex:1}
.btn{background:var(--sun);color:var(--ink);font-family:'Fredoka';font-size:20px;border-radius:999px;padding:14px 18px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn.t{background:var(--teal)}.btn.w{display:block;width:100%;margin-top:18px}
.mit{display:flex;align-items:center;gap:12px;margin-top:18px;background:rgba(255,255,255,.12);border-radius:24px;padding:12px 16px;font-size:18px}
.mit .p{font-size:46px}.mit.on{background:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.opt{display:block;width:100%;background:var(--card);color:var(--ink);font-family:'Fredoka';font-size:22px;border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.ok{background:var(--mint)!important;animation:pop .45s}.no{animation:shake .4s}
@keyframes pop{50%{transform:scale(1.07)}}@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.ctr{text-align:center}.big{font-size:90px}
.lines{background:var(--card);color:var(--ink);border-radius:28px;padding:14px;margin-top:16px}
.lines p{margin:0;padding:11px 14px;border-radius:16px;font-family:'Fredoka';font-size:21px;transition:.2s}
.lines p.hl{background:var(--sun);transform:scale(1.03)}
.dn{font-size:64px;text-align:center;margin-top:10px}.dn.on>span{display:inline-block;animation:bob .6s infinite}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips span{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-size:15px}
.panel{background:var(--card);color:var(--ink);border-radius:26px;padding:16px 20px;margin-top:14px}
.panel div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e8e4f5}.panel div:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(29,26,74,.94);backdrop-filter:blur(8px)}
nav button{flex:1;max-width:160px;background:rgba(255,255,255,.08);border-radius:18px;padding:8px 4px;font-size:14px}
nav button b{display:block;font-size:24px}nav button.on{background:var(--sun);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ch{display:inline-block;flex:none}.ch svg{width:100%;height:100%;display:block}.bubo .o{font-size:0}
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.fc{background:rgba(255,255,255,.12);border-radius:22px;padding:10px 4px;font-family:Fredoka,sans-serif;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px}.fc.b{animation:pop .5s}
.vm{display:none;background:#fff3c4;color:var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:14px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.o3{background:var(--card);border-radius:26px;aspect-ratio:1;font-size:clamp(44px,15vw,64px);display:grid;place-items:center;box-shadow:0 7px 0 rgba(0,0,0,.18)}.o3:active{transform:translateY(4px)}
.pc{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);color:var(--ink);border-radius:22px;padding:10px 16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,0,0,.18);text-align:left}.pc:active{transform:translateY(4px)}.pv{width:72px;height:72px;display:grid;place-items:center;font-size:50px;flex:none;line-height:1.1}.pv svg{width:100%;height:100%}.pv.s{font-size:18px;width:96px;text-align:center;word-break:break-all}.pl{font-family:'Fredoka','Noto Sans Devanagari',sans-serif;font-size:21px}
.pk{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);color:var(--ink);border-radius:28px;padding:14px 16px;margin-top:14px;box-shadow:0 8px 0 rgba(0,0,0,.18);text-align:left}.pk.on{outline:4px solid var(--sun)}.pk h3{font-family:'Fredoka',sans-serif;font-size:26px;margin:0}.pk .t{font-size:15px;opacity:.75}.pk .ck{margin-left:auto;font-size:26px}.fc.on{outline:3px solid var(--sun)}.btn:disabled{opacity:.4}
.ch .body{transform-box:view-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,.972)}}
.ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.ch .mouth{transform-box:fill-box;transform-origin:50% 0}
.ch.talk .mouth{animation:mth .26s ease-in-out infinite alternate}
@keyframes mth{from{transform:scaleY(.55)}to{transform:scaleY(1.6)}}
.ch.talk .body{animation:talkbob .45s ease-in-out infinite alternate}
@keyframes talkbob{to{transform:translateY(-2px) rotate(-2.5deg)}}
.ch .wl,.ch .wr,.ch .el,.ch .er{transform-box:fill-box}
.ch .wl{transform-origin:100% 20%}.ch .wr{transform-origin:0 20%}.ch .el,.ch .er{transform-origin:50% 100%}
.ch.happy{animation:hop .55s ease-out 3}
@keyframes hop{40%{transform:translateY(-16%) scale(1.08)}}
.ch.happy .wl,.ch.dance .wl{animation:flapl .22s infinite alternate}.ch.happy .wr,.ch.dance .wr{animation:flapr .22s infinite alternate}
.ch.happy .el,.ch.dance .el{animation:earl .3s infinite alternate}.ch.happy .er,.ch.dance .er{animation:earr .3s infinite alternate}
@keyframes flapl{to{transform:rotate(38deg)}}@keyframes flapr{to{transform:rotate(-38deg)}}
@keyframes earl{to{transform:rotate(-16deg)}}@keyframes earr{to{transform:rotate(16deg)}}
.ch.dance{animation:hop .8s ease-in-out infinite}
.ch.oops{animation:oops .6s}
@keyframes oops{20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.ch{position:relative}
.ch.img .sh{position:absolute;left:18%;right:18%;bottom:-2%;height:9%;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(4px);animation:shd 4.2s ease-in-out infinite}
.ch.img .cm{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 100%;animation:popin .5s cubic-bezier(.3,1.6,.5,1) both,idle 4.2s ease-in-out .5s infinite}
.ch.img img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none}
.ch.img .im-n{opacity:1}
@keyframes popin{from{transform:scale(0) rotate(-12deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes idle{0%,100%{transform:scale(1,1) rotate(0)}12%{transform:scale(1.035,.965)}28%{transform:scale(1,1) rotate(0)}50%{transform:translateY(-2%) rotate(-2deg)}75%{transform:translateY(-1%) rotate(2deg)}}
@keyframes shd{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.9);opacity:.7}}
.ch.img.talk .cm{animation:talkm .4s ease-in-out infinite alternate}
@keyframes talkm{from{transform:translateY(0) scale(1.03,.97) rotate(-3deg)}to{transform:translateY(-4%) scale(.98,1.04) rotate(3deg)}}
.ch.img.talk .im-n{animation:fa .3s steps(1) infinite alternate}
.ch.img.talk .im-t{animation:fb .3s steps(1) infinite alternate}
@keyframes fa{0%{opacity:1}50%,100%{opacity:0}}
@keyframes fb{0%{opacity:0}50%,100%{opacity:1}}
.ch.img.happy .im-n,.ch.img.happy .im-t,.ch.img.dance .im-n,.ch.img.dance .im-t,.ch.img.oops .im-n,.ch.img.oops .im-t{animation:none;opacity:0}
.ch.img.happy .im-h,.ch.img.dance .im-h{opacity:1}
.ch.img.oops .im-o{opacity:1}
.ch.img.happy,.ch.img.dance,.ch.img.oops{animation:none}
.ch.img.happy .cm{animation:jump 1.5s ease-in-out}
@keyframes jump{0%{transform:scale(1.12,.86)}12%{transform:translateY(-30%) scale(.92,1.12)}28%{transform:scale(1.14,.84)}38%{transform:translateY(-38%) scale(.92,1.1) rotate(-10deg)}54%{transform:scale(1.12,.86) rotate(0)}66%{transform:translateY(-14%) rotate(8deg)}80%{transform:scale(1.05,.95) rotate(-5deg)}100%{transform:scale(1)}}
.ch.img.happy .sh{animation:shj 1.5s ease-in-out}
@keyframes shj{12%{transform:scaleX(.5);opacity:.4}28%{transform:scaleX(1.15)}38%{transform:scaleX(.4);opacity:.3}54%{transform:scaleX(1.1)}100%{transform:scaleX(1)}}
.ch.img.dance .cm{animation:dnc .62s ease-in-out infinite}
@keyframes dnc{0%,100%{transform:translateY(0) rotate(-7deg) scale(1.06,.94)}50%{transform:translateY(-14%) rotate(7deg) scale(.96,1.06)}}
.ch.img.dance .sh{animation:shd .62s ease-in-out infinite}
.ch.img.oops .cm{animation:oopsm .8s ease-in-out}
@keyframes oopsm{0%{transform:scale(1.08,.92)}15%{transform:translateX(-6%) rotate(-10deg)}30%{transform:translateX(6%) rotate(10deg)}45%{transform:translateX(-5%) rotate(-7deg)}60%{transform:translateX(4%) rotate(5deg)}80%{transform:scale(.97,.97)}100%{transform:scale(1)}}
.ch.img.peek .cm{animation:peek 1s ease-in-out}
@keyframes peek{0%{transform:scale(1)}25%{transform:translateY(-9%) rotate(-9deg) scale(.97,1.05)}55%{transform:translateY(-4%) rotate(7deg)}100%{transform:scale(1)}}
.pt{position:absolute;left:50%;top:38%;line-height:1;pointer-events:none;z-index:6;animation:ptfly 1.1s ease-out forwards}
@keyframes ptfly{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.15) rotate(var(--r));opacity:0}}
.pt.dr{top:12%;left:72%;animation:ptdrop .9s ease-in forwards}
@keyframes ptdrop{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(-50%,160%);opacity:0}}
@media (prefers-reduced-motion:reduce){.pt{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><button data-t="learn" onclick="A.tab('learn')"><b>📚</b>Seekho</button><button data-t="rhy" onclick="A.tab('rhy')"><b>🎵</b>Rhymes</button><button data-t="par" onclick="A.tab('par')"><b>👨‍👩‍👧</b>Parents</button></nav>
<script>
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const L=[
{t:'Subah ki English',e:'🌅',c:'#ffe7a3',w:[['👨','Good morning, Papa!','सुप्रभात, पापा!'],['👩','Good morning, Mummy!','सुप्रभात, मम्मी!'],['👵','Good morning, Dadi!','सुप्रभात, दादी!'],['👴','Good morning, Dada!','सुप्रभात, दादा!'],['🪥','Brush your teeth!','दाँत ब्रश करो!']]},
{t:'Khana-Peena',e:'🍽️',c:'#ffd3de',w:[['💧','Water, please.','मुझे पानी चाहिए।'],['🍚','I am hungry.','मुझे भूख लगी है।'],['🥛','Milk, please.','मुझे दूध चाहिए।'],['😋','Yummy!','बहुत स्वादिष्ट!'],['🤰','I am full.','मेरा पेट भर गया।']]},
{t:'Magic Words',e:'✨',c:'#c9f3ef',w:[['🙏','Please.','कृपया।'],['💛','Thank you!','धन्यवाद!'],['😔','Sorry.','माफ़ करना।'],['👋','Excuse me.','माफ़ कीजिए।'],['🤗','You are welcome.','आपका स्वागत है।']]},
{t:'Raat ki English',e:'🌙',c:'#d9d4ff',w:[['🌙','Good night, Mummy!','शुभ रात्रि, मम्मी!'],['🌟','Good night, Papa!','शुभ रात्रि, पापा!'],['🤍','Good night, Dadi!','शुभ रात्रि, दादी!'],['🛏️','Sleep time.','सोने का समय।'],['💤','Sweet dreams!','मीठे सपने!']]}];
L[2].w[0][0]='🙏';L[1].w[4][0]='😌';
const R=[
{t:'Good Morning Song',e:'🌅',h:'Subah sabko Good morning bolna sikhao',l:['Good morning, Papa, the sun is bright,','Good morning, Mummy, hold me tight.','Good morning, Dadi, a happy day,','Good morning, everyone, let us play!']},
{t:'Magic Words Song',e:'✨',h:'Please, Thank you aur Sorry ka gaana',l:['Please, please, please, I say with a smile,','Thank you, thank you, all the while.','Sorry, sorry, if I am wrong,','Magic words, we sing this song!']},
{t:'Good Night Song',e:'🌙',h:'Raat ko Good night bolne ka gaana',l:['Good night, Papa, the stars are bright,','Good night, Mummy, sleep tight, good night.','Good night, Dadi, close your eyes,','The moon is smiling in the sky.']}];
const CH={
bubo:'<svg viewBox="0 0 100 100"><g class="body"><g class="wl"><ellipse cx="18" cy="62" rx="8" ry="18" fill="#5b3fd6"/></g><g class="wr"><ellipse cx="82" cy="62" rx="8" ry="18" fill="#5b3fd6"/></g><path d="M24 22l12 16 4-18zM76 22L64 38l-4-18z" fill="#5b3fd6"/><ellipse cx="50" cy="58" rx="33" ry="35" fill="#7b5cff"/><ellipse cx="50" cy="70" rx="21" ry="22" fill="#ddd2ff"/><g class="eyes"><circle cx="38" cy="46" r="13" fill="#fff"/><circle cx="62" cy="46" r="13" fill="#fff"/><circle cx="40" cy="47" r="6" fill="#241f5c"/><circle cx="60" cy="47" r="6" fill="#241f5c"/><circle cx="42" cy="45" r="2" fill="#fff"/><circle cx="62" cy="45" r="2" fill="#fff"/></g><path class="mouth" d="M44 55l6 9 6-9z" fill="#ffc93c"/><circle cx="27" cy="58" r="4" fill="#ff7096" opacity=".6"/><circle cx="73" cy="58" r="4" fill="#ff7096" opacity=".6"/><path d="M38 95h8m8 0h8" stroke="#ffc93c" stroke-width="5" stroke-linecap="round"/></g></svg>',
mitthu:'<svg viewBox="0 0 100 100"><g class="body"><path d="M44 90l-6 10h24l-6-10z" fill="#ff7096"/><g class="wl"><path d="M24 58q-12 22 6 36q4-22-6-36z" fill="#1f9b50"/></g><g class="wr"><path d="M76 58q12 22-6 36-4-22 6-36z" fill="#1f9b50"/></g><ellipse cx="50" cy="64" rx="27" ry="31" fill="#35c46a"/><ellipse cx="50" cy="74" rx="16" ry="19" fill="#bff3d2"/><circle cx="50" cy="38" r="24" fill="#35c46a"/><path d="M50 6c-7 4-9 11-6 18 4-4 8-5 12-4-1-6-3-10-6-14z" fill="#ff7096"/><g class="eyes"><circle cx="40" cy="36" r="9" fill="#fff"/><circle cx="60" cy="36" r="9" fill="#fff"/><circle cx="41" cy="37" r="4.5" fill="#241f5c"/><circle cx="59" cy="37" r="4.5" fill="#241f5c"/></g><path class="mouth" d="M40 45q10-6 20 0q-2 14-10 16-8-2-10-16z" fill="#ffc93c"/><circle cx="29" cy="46" r="4" fill="#ff7096" opacity=".6"/><circle cx="71" cy="46" r="4" fill="#ff7096" opacity=".6"/></g></svg>',
pinky:'<svg viewBox="0 0 100 100"><g class="body"><g class="el"><ellipse cx="35" cy="24" rx="9" ry="23" fill="#ffd3de"/><ellipse cx="35" cy="26" rx="4" ry="15" fill="#ff7096"/></g><g class="er"><ellipse cx="65" cy="24" rx="9" ry="23" fill="#ffd3de"/><ellipse cx="65" cy="26" rx="4" ry="15" fill="#ff7096"/></g><circle cx="50" cy="62" r="32" fill="#fff4f7"/><g class="eyes"><circle cx="39" cy="56" r="5" fill="#241f5c"/><circle cx="61" cy="56" r="5" fill="#241f5c"/><circle cx="40.5" cy="54.5" r="1.8" fill="#fff"/><circle cx="62.5" cy="54.5" r="1.8" fill="#fff"/></g><ellipse cx="50" cy="66" rx="4.5" ry="3.2" fill="#ff7096"/><path class="mouth" d="M50 69v4m-7 1q7 6 14 0" stroke="#241f5c" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="29" cy="68" r="5" fill="#ff7096" opacity=".45"/><circle cx="71" cy="68" r="5" fill="#ff7096" opacity=".45"/></g></svg>'};
const ch=(n,z)=>`<span class="ch img" data-c="${n}" style="width:${z}px;height:${z}px"><span class="sh"></span><span class="cm"><img class="im-n" src="img/${n}_normal.png" alt="" onerror="chFb(this,'${n}')"><img class="im-t" src="img/${n}_talk.png" alt="" onerror="chPose(this)"><img class="im-h" src="img/${n}_happy.png" alt="" onerror="chPose(this)"><img class="im-o" src="img/${n}_oops.png" alt="" onerror="chPose(this)"></span></span>`;
function chFb(im,n){const sp=im.closest('.ch');if(sp&&sp.classList.contains('img')){sp.classList.remove('img');sp.innerHTML=CH[n]}}
function chPose(im){const n=im.closest('.ch')&&im.closest('.ch').querySelector('.im-n');if(n&&n.getAttribute('src')&&im.getAttribute('src')!==n.getAttribute('src'))im.src=n.getAttribute('src')}

const LET=[['A','🍎','Apple','सेब'],['B','⚽','Ball','गेंद'],['C','🐱','Cat','बिल्ली'],['D','🐶','Dog','कुत्ता'],['E','🐘','Elephant','हाथी'],['F','🐟','Fish','मछली'],['G','🍇','Grapes','अंगूर'],['H','👒','Hat','टोपी'],['I','🍦','Ice cream','आइसक्रीम'],['J','🃏','Joker','जोकर'],['K','🔑','Key','चाबी'],['L','🦁','Lion','शेर'],['M','🌙','Moon','चाँद'],['N','👃','Nose','नाक'],['O','🍊','Orange','संतरा'],['P','🦜','Parrot','तोता'],['Q','👸','Queen','रानी'],['R','🌈','Rainbow','इंद्रधनुष'],['S','☀️','Sun','सूरज'],['T','🐯','Tiger','बाघ'],['U','☂️','Umbrella','छाता'],['V','🚐','Van','गाड़ी'],['W','⌚','Watch','घड़ी'],['X','🎄','Xmas tree','क्रिसमस ट्री'],['Y','⛵','Yacht','नाव'],['Z','🦓','Zebra','ज़ेबरा']];
const abc=(a,b)=>LET.slice(a,b).map(x=>[x[1],x[0]+' for '+x[2],x[3]]);

}
