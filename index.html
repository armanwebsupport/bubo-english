.list{display:grid;gap:14px}

.mit{display:flex;align-items:center;gap:12px;margin-top:18px;background:rgba(255,255,255,.12);border-radius:24px;padding:12px 16px;font-size:18px}
.mit .p{font-size:46px}.mit.on{background:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.opt{display:block;width:100%;background:var(--card);color:var(--ink);font-family:'Fredoka';font-size:22px;border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 6px 0 rgba(0,0,0,.18)}

.ctr{text-align:center}.big{font-size:90px}

.panel{background:var(--card);color:var(--ink);border-radius:26px;padding:16px 20px;margin-top:14px}
.panel div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e8e4f5}.panel div:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(29,26,74,.94);backdrop-filter:blur(8px)}
nav button{flex:1;max-width:160px;background:rgba(255,255,255,.08);border-radius:18px;padding:8px 4px;font-size:14px}
nav button b{display:block;font-size:24px}nav button.on{background:var(--sun);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ch{display:inline-block;flex:none}.ch svg{width:100%;height:100%;display:block}.bubo .o{font-size:0}
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.fc{background:rgba(255,255,255,.12);border-radius:22px;padding:10px 4px;font-family:Fredoka,sans-serif;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px}.fc.b{animation:pop .5s}
.vm{display:none;background:#fff3c4;color:var(--ink);border-radius:18px;padding:12px 16px;margin-bottom:14px;font-size:16px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.o3{background:var(--card);border-radius:26px;aspect-ratio:1;font-size:clamp(44px,15vw,64px);display:grid;place-items:center;box-shadow:0 7px 0 rgba(0,0,0,.18)}.o3:active{transform:translateY(4px)}

    const u=new SpeechSynthesisUtterance(t);
    if(v){u.voice=v;u.lang=v.lang}else u.lang=l;
    u.rate=r||.75;u.pitch=1.15;u.volume=1;u.onend=done;u.onerror=done;
    setTimeout(()=>{if(my!=SEQ)return;try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){done()}},80);
    setTimeout(done,2500+t.length*200);
  }catch(e){done()}
}
function say(t,l,r,cb){
  l=l||'en-IN';let fired=0,fb=0;const done=()=>{if(cb&&!fired){fired=1;cb()}};
  const my=++SEQ;TTSCB={};
  try{if(window.AndroidTTS)AndroidTTS.stop()}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  try{if(AUDIO){AUDIO.onended=AUDIO.onerror=null;AUDIO.pause()}}catch(e){}
  const fall=()=>{if(!fb&&my==SEQ){fb=1;tts(t,l,r,done,my)}};
  try{const a=new Audio('audio/'+key(l,t)+'.mp3');AUDIO=a;a.onended=done;a.onerror=fall;const p=a.play();if(p&&p.catch)p.catch(fall)}catch(e){fall()}
}
function halt(){S.tok++;SEQ++;TTSCB={};try{if(window.AndroidTTS)AndroidTTS.stop()}catch(e){}try{speechSynthesis.cancel()}catch(e){}try{if(AUDIO){AUDIO.onended=AUDIO.onerror=null;AUDIO.pause()}}catch(e){}}
function bar(n,t){return '<div class="prog">'+Array.from({length:t},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')+'</div>'}
function setNav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab))}
const A={
tab(t){halt();S.tab=t;setNav();A[t=='learn'?'learn':t=='rhy'?'rhy':'par']()},
learn(){
  halt();const h=new Date().getHours(),g=h<12?['Good morning!','सुप्रभात!']:h<17?['Good afternoon!','नमस्कार!']:h<21?['Good evening!','शुभ संध्या!']:['Good night!','शुभ रात्रि!'];
  A.g=g[0];
  app.innerHTML=`<div class="top"><h1 style="font-size:24px">Bubo English</h1><div style="display:flex;gap:8px"><button class="pill" onclick="A.vtest()">🔊</button><div class="pill">⭐ ${S.stars}</div></div></div>
  <div id="vmsg" class="vm"></div>
  <div class="bubo"><div class="o">${ch('bubo',84)}</div><button class="say" onclick="say(A.g)"><small class="hi">${g[1]}</small>${g[0]} 🔊<small>Aaj kya seekhein?</small></button></div>
  <h2 class="s">Mere dost</h2><div class="fr">${[['bubo','Bubo','Hi, I am Bubo the owl!'],['mitthu','Mitthu','Hello, I am Mitthu the parrot!'],['pinky','Pinky','Hi, I am Pinky the bunny!']].map(c=>`<button class="fc" onclick="say('${c[2]}');this.classList.add('b');setTimeout(()=>this.classList.remove('b'),600)">${ch(c[0],72)}<b>${c[1]}</b></button>`).join('')}</div>
  ${GR.map(g=>`<h2 class="s">${g[0]}</h2><div class="list">${g[1].map(card).join('')}</div>`).join('')}`;
},
les(i,k){
  const x=L[i],it=x.w[k],n=x.w.length;
  app.innerHTML=`<div class="top"><button class="pill" onclick="A.learn()">← Wapas</button><div class="pill">${k+1}/${n}</div></div>${bar(k+1,n)}
  <div class="card">${em(it)}<div class="en">${it[1]}</div><div class="hn hi">${it[2]}</div></div>
  <div class="mit" id="mit">${ch('mitthu',60)}<div id="mt">Mitthu bolega, tum bhi bolo!</div></div>
  <div class="row"><button class="btn t" onclick="say('${it[1].replace(/'/g,"\\'")}','${x.h?'hi-IN':'en-IN'}',.7)">🔊 Suno</button><button class="btn" onclick="A.rep(${i},${k})">🎤 Bolo</button></div>
  <button class="btn w" onclick="${k<n-1?`A.les(${i},${k+1})`:`A.quiz(${i})`}">${k<n-1?'Aage →':'Quiz khelo 🎯'}</button>`;
  say(it[1],x.h?'hi-IN':'en-IN',.7);
},
rep(i,k){
  const m=$('#mit'),t=$('#mt');if(!m)return;
  say(L[i].w[k][1],L[i].h?'hi-IN':'en-IN',.55,()=>{if($('#mit')){m.classList.add('on');t.textContent='Ab tum bolo! 🎤';setTimeout(()=>{if($('#mit')){m.classList.remove('on');t.textContent='Shabash! Phir se bolo?'}},3500)}});
},
quiz(i){
  halt();const x=L[i],qs=sh(x.w).slice(0,5),n=qs.length;let q=0,right=0;
  (function nx(){
    if(q==n){S.done[i]=1;app.innerHTML=`<div class="ctr" style="margin-top:50px"><div class="big">🏆</div><h2 style="font-size:32px;margin:12px 0">Shabash!</h2><p style="font-size:20px">Tumne ${right} naye words seekhe ⭐</p><button class="btn w" onclick="A.learn()">Aur seekho</button></div>`;say('Shabash! Well done!');return}
    const it=qs[q],o=sh([it[1],...sh(x.w.map(w=>w[1]).filter(p=>p!=it[1])).slice(0,2)]);let first=true;
    if(x.h){const o2=sh([it,...sh(x.w.filter(w=>w!=it)).slice(0,2)]);
      app.innerHTML=`<div class="top"><button class="pill" onclick="A.learn()">← Wapas</button><div class="pill">⭐ ${S.stars}</div></div>${bar(q,n)}<div class="card"><div class="en">${it[1]}</div><button class="btn" id="hs" style="margin-top:14px">🔊 Suno</button><div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px">${ch('pinky',54)}<span>Suno aur sahi tasveer chuno</span></div></div><div class="opts">${o2.map((p,j)=>`<button class="o3" data-j="${j}">${p[0]}</button>`).join('')}</div>`;
      $('#hs').onclick=()=>say(it[1],'hi-IN',.7);say(it[1],'hi-IN',.7);
      document.querySelectorAll('.o3').forEach(b=>b.onclick=()=>{
        if(o2[b.dataset.j]==it){b.classList.add('ok');S.stars++;S.got.add(it[1]);if(first)right++;say('Shabash!');q++;setTimeout(nx,1300)}
        else{first=false;b.classList.add('no');say('Try again');setTimeout(()=>b.classList.remove('no'),450)}
      });return}
    app.innerHTML=`<div class="top"><button class="pill" onclick="A.learn()">← Wapas</button><div class="pill">⭐ ${S.stars}</div></div>${bar(q,n)}
    <div class="card">${em(it)}<div class="hn hi" style="font-size:26px;opacity:1">${it[2]}</div><div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px">${ch('pinky',54)}<span>Isko English mein kya kehte hain?</span></div></div>
    ${o.map((p,j)=>`<button class="opt" data-j="${j}">${p}</button>`).join('')}`;
    say(it[2],'hi-IN',.85);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(o[b.dataset.j]==it[1]){b.classList.add('ok');S.stars++;S.got.add(it[1]);if(first)right++;say(it[1],'en-IN',.7);q++;setTimeout(nx,1500)}
      else{first=false;b.classList.add('no');say('Try again');setTimeout(()=>b.classList.remove('no'),450)}
    });
  })();
},
rhy(){
  halt();
  app.innerHTML=`<div class="top"><h1 style="font-size:24px">Rhymes 🎵</h1><div class="pill">⭐ ${S.stars}</div></div><div class="bubo"><div class="o">${ch('mitthu',84)}</div><div class="say">Chalo, mere saath gaao!</div></div>
  <div class="list">${R.map((x,i)=>`<button class="g" onclick="A.song(${i})"><div class="e" style="background:#ffe7a3">${x.e}</div><div><h3>${x.t}</h3><span>${x.h}</span></div><div class="ck">▶️</div></button>`).join('')}</div>`;
},
song(i){
  halt();const r=R[i];
  app.innerHTML=`<div class="top"><button class="pill" onclick="A.rhy()">← Wapas</button><div class="pill">⭐ ${S.stars}</div></div>
  <div class="dn" id="dn"><span>${ch('bubo',84)}</span><span style="animation-delay:.15s">${ch('mitthu',84)}</span><span style="animation-delay:.3s">${ch('pinky',84)}</span></div>
  <h2 class="ctr" style="font-size:26px;margin-top:6px">${r.t}</h2>
  <div class="lines">${r.l.map((x,k)=>`<p id="ln${k}">${x}</p>`).join('')}</div>
  <button class="btn w" onclick="A.sing(${i})">🎶 Gaao</button>`;
},
sing(i){
  halt();const t=S.tok,r=R[i];
  const step=k=>{
    if(t!=S.tok)return;
    document.querySelectorAll('.lines p').forEach(p=>p.classList.remove('hl'));
    if(k>=r.l.length){$('#dn')&&$('#dn').classList.remove('on');S.stars++;S.songs++;return}
    const p=$('#ln'+k);if(!p)return;p.classList.add('hl');$('#dn').classList.add('on');
    say(r.l[k],'en-IN',.8,()=>setTimeout(()=>step(k+1),250));
  };step(0);
},
vtest(){
  loadV();const m=$('#vmsg');let t;
  if(window.AndroidTTS){const en=AndroidTTS.has('en-IN')||AndroidTTS.has('en-US'),hi=AndroidTTS.has('hi-IN');
    t=!en?'⚠️ Phone mein English awaaz nahi mili. Settings → Text-to-speech mein Google TTS on karo aur media volume badhao.':'✅ Awaaz mili.'+(hi?'':' ⚠️ Hindi awaaz nahi mili: Settings → Text-to-speech mein Hindi voice download karo.');
    m.textContent=t;m.style.display='block';if(en)say('Hello! I am Bubo. Let us learn English!');return}
  if(!('speechSynthesis' in window))t='❌ Is browser mein awaaz support nahi hai. Chrome mein kholo.';
  else if(!VO.length)t='⚠️ Phone mein awaaz (Text-to-speech) nahi mili. Settings mein Text-to-speech / Google TTS on karo, aur media volume badhao.';
  else{t='✅ Awaaz mili ('+VO.length+' voices). Suno...';say('Hello! I am Bubo. Let us learn English!');if(!pick('hi-IN'))t+=' ⚠️ Hindi awaaz nahi mili: Hindi alphabets mein awaaz nahi aayegi.'}
  m.textContent=t;m.style.display='block'},
par(){
  halt();const w=[...S.got];
  app.innerHTML=`<div class="top"><h1 style="font-size:24px">Parents 👨‍👩‍👧</h1></div>
  <div class="panel"><div><span>Lessons poore</span><b>${Object.keys(S.done).length} / ${L.length}</b></div><div><span>Naye words seekhe</span><b>${w.length} / ${ALL.length}</b></div><div><span>Rhymes gaaye</span><b>${S.songs}</b></div><div><span>Total stars</span><b>⭐ ${S.stars}</b></div></div>
  <h2 class="s" style="margin-top:18px">Seekhe hue words</h2><div class="chips">${w.length?w.map(x=>`<span>${x}</span>`).join(''):'<span>Abhi koi nahi — pehla lesson khelo!</span>'}</div>
  <p style="opacity:.75;font-size:15px;margin-top:20px">Demo: asli app mein daily time limit, weekly report aur parent lock hoga. Koi ads nahi, koi chat nahi.</p>`;
}};
S.tab="learn";setNav();A.learn();
</script>
