name: Build Bubo English APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project
        run: |
          set -e
          P=android
          J=$P/app/src/main/java/com/arman/buboenglish
          mkdir -p $J $P/app/src/main/res/drawable $P/app/src/main/assets/www/audio
          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BuboEnglish"
          include ':app'
          EOF
          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo "org.gradle.jvmargs=-Xmx2048m" > $P/gradle.properties
          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.arman.buboenglish'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.arman.buboenglish'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
              <application android:label="Bubo English" android:icon="@drawable/ic_launcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > $P/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1D1A4A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#7B5CFF" android:pathData="M24,58a30,30 0 1,0 60,0a30,30 0 1,0 -60,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M36,52a8,8 0 1,0 16,0a8,8 0 1,0 -16,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M56,52a8,8 0 1,0 16,0a8,8 0 1,0 -16,0"/>
              <path android:fillColor="#241F5C" android:pathData="M42,53a4,4 0 1,0 8,0a4,4 0 1,0 -8,0"/>
              <path android:fillColor="#241F5C" android:pathData="M62,53a4,4 0 1,0 8,0a4,4 0 1,0 -8,0"/>
              <path android:fillColor="#FFC93C" android:pathData="M50,60L58,60L54,70Z"/>
          </vector>
          EOF
          cat > $J/MainActivity.java <<'EOF'
          package com.arman.buboenglish;

          import android.app.Activity;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView w;
              private TextToSpeech tts;
              private boolean ready = false;

              private Locale loc(String lang) {
                  String[] p = lang.split("-");
                  return p.length > 1 ? new Locale(p[0], p[1]) : new Locale(p[0]);
              }

              private void done(final String id) {
                  runOnUiThread(new Runnable() {
                      public void run() {
                          w.evaluateJavascript("window.__ttsDone&&window.__ttsDone('" + id + "')", null);
                      }
                  });
              }

              public class Bridge {
                  @JavascriptInterface
                  public boolean has(String lang) {
                      return ready && tts.isLanguageAvailable(loc(lang)) >= TextToSpeech.LANG_AVAILABLE;
                  }
                  @JavascriptInterface
                  public void speak(String id, String text, String lang, double rate) {
                      speak(id, text, lang, rate, 1.15);
                  }
                  @JavascriptInterface
                  public void speak(String id, String text, String lang, double rate, double pitch) {
                      if (!ready) { done(id); return; }
                      Locale l = loc(lang);
                      if (tts.isLanguageAvailable(l) < TextToSpeech.LANG_AVAILABLE) {
                          if (lang.startsWith("en")) { l = Locale.US; } else { done(id); return; }
                      }
                      tts.setLanguage(l);
                      tts.setSpeechRate((float) rate);
                      tts.setPitch((float) pitch);
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, id);
                  }
                  @JavascriptInterface
                  public void stop() {
                      if (ready) { tts.stop(); }
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  w = new WebView(this);
                  setContentView(w);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  w.setWebViewClient(new WebViewClient());
                  w.setWebChromeClient(new WebChromeClient());
                  w.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  tts = new TextToSpeech(this, new TextToSpeech.OnInitListener() {
                      public void onInit(int status) {
                          ready = (status == TextToSpeech.SUCCESS);
                          if (ready) {
                              tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                                  public void onStart(String id) {}
                                  public void onDone(String id) { done(id); }
                                  public void onError(String id) { done(id); }
                              });
                          }
                      }
                  });
                  w.loadUrl("file:///android_asset/www/index.html");
              }

              @Override protected void onPause() { super.onPause(); w.onPause(); }
              @Override protected void onResume() { super.onResume(); w.onResume(); }
              @Override protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  super.onDestroy();
              }
          }
          EOF
          cp index.html $P/app/src/main/assets/www/index.html
          mkdir -p $P/app/src/main/assets/www/img
          for f in bubo_*.png mitthu_*.png pinky_*.png; do
            if [ -f "$f" ]; then cp "$f" $P/app/src/main/assets/www/img/; fi
          done
          if [ -f audio.zip ]; then unzip -q -o audio.zip -d $P/app/src/main/assets/www/audio; fi
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Bubo-English-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
